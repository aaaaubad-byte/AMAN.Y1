/* Unified navigation: clean outline icons directly on both navigation surfaces */
:root{
  --nav-h:50px;--rail-w:56px;
  --nav-surface:#102d3b;--nav-border:#244452;
  --nav-icon:#c2d2d9;--nav-muted:#9aafb9;--nav-active:#39c4cf;
}
.sidebar{
  position:fixed!important;top:0!important;right:0!important;bottom:calc(var(--nav-h) + var(--safe-bottom))!important;
  width:var(--rail-w)!important;min-width:var(--rail-w)!important;height:100dvh!important;
  padding:10px 4px 8px!important;
  display:flex!important;flex-direction:column!important;align-items:stretch!important;
  gap:7px!important;overflow-x:hidden!important;overflow-y:auto!important;
  background:var(--nav-surface)!important;color:#edf5f7!important;
  border-left:1px solid var(--nav-border)!important;box-shadow:none!important;
  transform:none!important;transition:none!important;z-index:30!important;
}
.drawer-head{justify-content:center!important;min-height:43px!important}
.brand{
  width:100%!important;justify-content:center!important;padding:3px 0 8px!important;
  margin:0!important;border:0!important;border-bottom:1px solid var(--nav-border)!important;
}
.brand-mark{
  width:auto!important;height:auto!important;min-width:0!important;padding:0!important;
  border:0!important;border-radius:0!important;background:transparent!important;
  box-shadow:none!important;color:var(--nav-active)!important;
  font-size:23px!important;font-weight:700!important;
}
.brand>div:not(.brand-mark),.drawer-close,.nav-title,.side-foot{display:none!important}
.nav-group{
  width:100%!important;margin:0!important;padding:5px 0 7px!important;
  border:0!important;border-bottom:1px solid var(--nav-border)!important;
}
.nav-item{
  position:relative!important;display:flex!important;align-items:center!important;
  justify-content:center!important;width:100%!important;height:39px!important;
  min-height:39px!important;margin:2px 0!important;padding:0!important;
  border:0!important;border-radius:0!important;background:transparent!important;
  box-shadow:none!important;color:var(--nav-icon)!important;
  transition:color .16s ease!important;
}
.nav-item>span:not(.ico){display:none!important}
.nav-item .ico,.bottom-item .ico{
  display:grid!important;place-items:center!important;width:22px!important;
  height:22px!important;min-width:22px!important;margin:0!important;padding:0!important;
  flex:none!important;border:0!important;border-radius:0!important;
  background:transparent!important;box-shadow:none!important;outline:0!important;
  color:currentColor!important;
}
.nav-item .ico svg,.bottom-item .ico svg{
  display:block!important;width:22px!important;height:22px!important;
  stroke:currentColor!important;fill:none!important;stroke-width:1.8!important;
  stroke-linecap:round!important;stroke-linejoin:round!important;
}
.nav-item:hover{color:#fff!important;background:transparent!important}
.nav-item.active{
  color:var(--nav-active)!important;background:transparent!important;
  border:0!important;box-shadow:none!important;
}
.nav-item.active::before{
  content:"";position:absolute;right:-5px;top:10px;bottom:10px;
  width:2px;border-radius:2px;background:var(--nav-active);
}
.main{
  width:100%!important;min-width:0!important;padding-right:var(--rail-w)!important;
  padding-bottom:calc(var(--nav-h) + var(--safe-bottom) + 8px)!important;
}
.topbar-menu{display:none!important}
.bottom-nav{
  position:fixed!important;right:0!important;left:0!important;bottom:0!important;
  transform:none!important;width:100%!important;height:calc(var(--nav-h) + var(--safe-bottom))!important;
  display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;
  align-items:center!important;gap:0!important;
  padding:2px 3px calc(2px + var(--safe-bottom))!important;
  background:var(--nav-surface)!important;border:0!important;
  border-top:1px solid var(--nav-border)!important;border-right:0!important;
  border-radius:0!important;box-shadow:none!important;backdrop-filter:none!important;z-index:25!important;
}
.bottom-item{
  position:relative!important;display:flex!important;flex-direction:column!important;
  align-items:center!important;justify-content:center!important;width:100%!important;
  height:44px!important;min-width:0!important;gap:2px!important;
  padding:2px 1px!important;margin:0!important;border:0!important;border-radius:0!important;
  background:transparent!important;box-shadow:none!important;color:var(--nav-muted)!important;
  font-size:9px!important;font-weight:600!important;line-height:1.2!important;
  transition:color .16s ease!important;
}
.bottom-item .ico{width:22px!important;height:22px!important}
.bottom-item.active{color:var(--nav-active)!important;background:transparent!important;box-shadow:none!important}
.bottom-item.active::before{
  content:"";position:absolute;top:-4px;left:50%;transform:translateX(-50%);
  width:22px;height:2px;border-radius:2px;background:var(--nav-active);
}
.bottom-item::after{display:none!important}
.bottom-item:active,.nav-item:active{transform:none!important}
.nav-item:focus-visible,.bottom-item:focus-visible{
  outline:2px solid var(--nav-active)!important;outline-offset:-3px!important;
}
.drawer-backdrop{display:none!important}
@media(min-width:600px){
  body{padding:0!important}
  .app{min-height:100dvh!important;border-radius:0!important;overflow:visible!important}
  .sidebar{right:calc((100vw - min(480px,100vw))/2)!important}
  .bottom-nav{
    right:calc((100vw - min(480px,100vw))/2)!important;
    left:calc((100vw - min(480px,100vw))/2)!important;
  }
  .main{padding-bottom:calc(var(--nav-h) + var(--safe-bottom) + 8px)!important}
}
@media(max-width:360px){
  :root{--rail-w:62px;--nav-h:64px}
  .sidebar{width:var(--rail-w)!important;min-width:var(--rail-w)!important}
  .main{padding-right:var(--rail-w)!important}
  .bottom-nav{right:0!important}
  .nav-item .ico,.bottom-item .ico,.nav-item .ico svg,.bottom-item .ico svg{
    width:21px!important;height:21px!important;min-width:21px!important;
  }
  .bottom-item{font-size:8px!important}
}

/* Compact continuous L-shaped navigation */
@media(max-width:599px){
  .sidebar{bottom:calc(var(--nav-h) + var(--safe-bottom))!important;width:var(--rail-w)!important}
  .bottom-nav{right:0!important;left:0!important;width:100%!important;grid-template-columns:repeat(5,minmax(0,1fr))!important}
}
@media(min-width:600px){
  .sidebar{bottom:calc(var(--nav-h) + var(--safe-bottom))!important}
  .bottom-nav{right:calc((100vw - min(480px,100vw))/2)!important;left:calc((100vw - min(480px,100vw))/2)!important;width:min(480px,100vw)!important}

<script>
(()=> {
'use strict';
const DB_NAME='radius_manager_local', DB_VERSION=1;
const stores=['nas','plans','users','vouchers','sessions','accounting','authLogs','addresses','audit','settings'];
let db, memoryMode=false, memoryStores={}, currentPage='dashboard', pageSize=100, voucherSelection=new Set();
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const titles={dashboard:'لوحة المعلومات',server:'إعدادات خادم RADIUS',nas:'أجهزة NAS',auth:'إعدادات المصادقة',accounting:'إعدادات المحاسبة',users:'المستخدمون والحسابات',vouchers:'إدارة الكروت',plans:'الخطط والباقات',sessions:'الجلسات النشطة',addresses:'عناوين IP وMAC',logs:'سجل المصادقة',usage:'سجل الاستخدام والمحاسبة',reports:'التقارير والإحصائيات',settings:'إعدادات النظام',backup:'النسخ الاحتياطي واستعادة البيانات',audit:'سجل العمليات الإدارية'};

function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
async function all(s){return memoryMode?[...memoryStores[s].values()]:req(tx(s).getAll())}
async function get(s,id){return memoryMode?(memoryStores[s].get(id)||undefined):req(tx(s).get(id))}

async function del(s,id){if(memoryMode){memoryStores[s].delete(id);return}return req(tx(s,'readwrite').delete(id))}
async function count(s){return memoryMode?memoryStores[s].size:req(tx(s).count())}
async function initDB(){
  try{
    if(!window.indexedDB)throw new Error('IndexedDB غير متاح في هذا السياق');
    db=await new Promise((resolve,reject)=>{let r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{let d=r.result;stores.forEach(s=>{if(!d.objectStoreNames.contains(s)){let o=d.createObjectStore(s,{keyPath:'id'});if(s==='vouchers'){o.createIndex('code','code',{unique:true});o.createIndex('planId','planId');o.createIndex('status','status')}if(s==='users'){o.createIndex('username','username',{unique:true});o.createIndex('planId','planId')}if(s==='nas')o.createIndex('ip','ip',{unique:true})}})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('فشل فتح IndexedDB'));r.onblocked=()=>reject(new Error('فتح قاعدة البيانات محظور من المتصفح'))});
  }catch(err){
    console.warn('تعذر استخدام IndexedDB، سيتم تشغيل وضع الذاكرة المؤقتة:',err);
    memoryMode=true;memoryStores=Object.fromEntries(stores.map(name=>[name,new Map()]));
  }
  for(const [k,v] of Object.entries(defaults))if(!(await get('settings',k)))await put('settings',{id:k,...v});
  if(memoryMode)notify('المعاينة تعمل بوضع مؤقت؛ لن تُحفظ البيانات بعد إغلاق الصفحة');
}

function closeModal(){$('#modalBack').classList.remove('show')}
function field(label,name,value='',type='text',extra=''){return `<div class="form-row"><label>${label}</label><input class="field" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function selectField(label,name,options,value=''){return `<div class="form-row"><label>${label}</label><select class="field" name="${name}">${options.map(o=>`<option value="${esc(o.value)}" ${o.value===value?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>`}

function filterTable(){let q=($('#tableSearch')?.value||'').toLowerCase(),st=$('#statusFilter')?.value||'';$$('#dataTable tbody tr').forEach(r=>r.style.display=(!q||r.innerText.toLowerCase().includes(q))&&(!st||r.innerText.includes(st))?'':'none')}
const navIconPaths={
'layout-dashboard':'<rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/>',

function duration(a,b){if(!a)return '—';let sec=Math.max(0,Math.floor(((b||Date.now())-a)/1000));return `${Math.floor(sec/3600)}س ${Math.floor(sec%3600/60)}د`}
function voucherTable(a,p){let start=(voucherPage-1)*pageSize,rows=a.slice(start,start+pageSize);return `${table(['<input type="checkbox" id="selectAll">','التسلسل','رقم الكرت','الباقة','السعر','الصلاحية','الحالة','تاريخ التوليد'],rows.map((x,i)=>`<tr><td><input type="checkbox" class="voucher-check" data-id="${x.id}" ${voucherSelection.has(x.id)?'checked':''}></td><td>${start+i+1}</td><td><b>${esc(x.code)}</b></td><td>${esc(p.find(z=>z.id===x.planId)?.name||'—')}</td><td>${esc(x.price||'—')}</td><td>${esc(x.validity||'—')}</td><td>${status(x.status)}</td><td>${fmt(x.createdAt)}</td></tr>`))}<div class="toolbar" style="justify-content:space-between"><span class="muted">صفحة ${voucherPage} من ${Math.max(1,Math.ceil(a.length/pageSize))} — ${a.length} سجل</span><div><button class="btn small" id="prevPage" ${voucherPage<=1?'disabled':''}>السابق</button> <button class="btn small" id="nextPage" ${voucherPage>=Math.ceil(a.length/pageSize)?'disabled':''}>التالي</button></div></div>`}
let voucherPage=1;
function refreshVoucherHandlers(){let a=$$('#voucherTable .voucher-check');a.forEach(c=>c.onchange=()=>{c.checked?voucherSelection.add(c.dataset.id):voucherSelection.delete(c.dataset.id)});let sa=$('#selectAll');if(sa)sa.onchange=()=>a.forEach(c=>{c.checked=sa.checked;c.onchange();});$('#prevPage')?.addEventListener('click',()=>{voucherPage--;render()});$('#nextPage')?.addEventListener('click',()=>{voucherPage++;render()});$('#pageSize')?.addEventListener('change',e=>{pageSize=+e.target.value;voucherPage=1;render()});$('#tableSearch')?.addEventListener('input',async e=>{voucherPage=1;let [a,p]=await Promise.all([all('vouchers'),all('plans')]);let q=e.target.value.toLowerCase();$('#voucherTable').innerHTML=voucherTable(a.filter(x=>x.code.toLowerCase().includes(q)),p);refreshVoucherHandlers()});$('#statusFilter')?.addEventListener('change',async e=>{voucherPage=1;let [a,p]=await Promise.all([all('vouchers'),all('plans')]);$('#voucherTable').innerHTML=voucherTable(a.filter(x=>!e.target.value||x.status===e.target.value),p);refreshVoucherHandlers()})}
const oldBindPage=bindPage;bindPage=async()=>{await oldBindPage();if(currentPage==='vouchers')refreshVoucherHandlers();$('#serverForm')?.addEventListener('submit',async e=>{e.preventDefault();let f=e.target;await put('settings',{id:'server',address:val(f,'address'),authPort:+val(f,'authPort'),acctPort:+val(f,'acctPort'),state:val(f,'state'),authSource:val(f,'authSource'),accounting:val(f,'accounting')});await log('تعديل إعدادات','الخادم','حفظ محلي');notify('تم حفظ الإعدادات محلياً')});$('#testServer')?.addEventListener('click',()=>notify('اختبار الاتصال غير متاح في وضع المحاكاة'));$('#generalForm')?.addEventListener('submit',async e=>{e.preventDefault();let f=e.target;await put('settings',{id:'general',networkName:val(f,'networkName'),managementAddress:val(f,'managementAddress'),language:val(f,'language'),timezone:val(f,'timezone')});await log('تعديل إعدادات','النظام','');notify('تم الحفظ');});};
const actions={
addNas:()=>nasForm(),editNas:b=>nasForm(b.dataset.id),deleteNas:async b=>{let x=await get('nas',b.dataset.id);if(confirm('حذف الجهاز '+x.name+'؟')){await del('nas',x.id);await log('حذف','NAS',x.name);render()}},

<style>
/* Correct the L junction: bottom rail spans the full width, with item five at the corner. */
.bottom-nav{
  right:0!important;left:0!important;width:100%!important;

  z-index:40!important;overflow:visible!important;
}
.bottom-nav .bottom-item:last-child{
  position:absolute!important;right:0!important;bottom:0!important;
  width:var(--rail-w)!important;height:100%!important;
  display:flex!important;align-items:center!important;justify-content:center!important;

}

    width:min(480px,100vw)!important;
  }
}
/* Descriptive labels for icon-only sidebar controls */
.nav-item{position:relative!important}
.nav-item::after{
  content:attr(data-label);position:absolute;right:calc(100% + 9px);top:50%;
  transform:translateY(-50%);white-space:nowrap;padding:7px 10px;
  border-radius:7px;background:#092331;color:#f4fbfd;font-size:12px;
  font-weight:600;line-height:1.3;opacity:0;visibility:hidden;pointer-events:none;
  box-shadow:0 4px 14px #061b2870;z-index:100;
}

  opacity:1;visibility:visible;
}
.bottom-item{position:relative!important}
.bottom-item:last-child>span:not(.ico){max-width:100%;font-size:8px!important}
</style>
<script>
/* Supply explicit, human-readable names to every navigation icon. */
document.querySelectorAll('.nav-item,.bottom-item').forEach(button=>{
  const label=button.querySelector('span:not(.ico)')?.textContent.trim() || button.dataset.page || 'قسم';
  button.dataset.label=label;
  button.setAttribute('aria-label',label);
  button.setAttribute('title',label);
});
</script>
